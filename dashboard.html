<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Dashboard - RND Staking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           ROOT VARIABLES
           ============================================================ */
        :root {
            --primary: #2ecc71;
            --primary-dark: #27ae60;
            --primary-light: #34d399;
            --primary-glow: rgba(46, 204, 113, 0.3);
            --primary-soft: rgba(46, 204, 113, 0.08);
            --bg-dark: #050a12;
            --bg-deep: #060b14;
            --bg-card: rgba(19, 34, 55, 0.68);
            --bg-card-hover: rgba(24, 42, 68, 0.88);
            --border-color: rgba(46, 204, 113, 0.1);
            --border-hover: rgba(46, 204, 113, 0.35);
            --text-primary: #f0f4ff;
            --text-secondary: #8899bb;
            --text-muted: #556688;
            --gold: #fbbf24;
            --blue: #60a5fa;
            --purple: #a78bfa;
            --teal: #34d399;
            --red: #f87171;
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-xl: 24px;
            --shadow-soft: 0 4px 16px rgba(0, 0, 0, 0.2);
            --shadow-deep: 0 12px 40px rgba(0, 0, 0, 0.35);
            --shadow-glow: 0 0 40px rgba(46, 204, 113, 0.08);
        }

        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { scroll-behavior: smooth; }

        body {
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background-image:
                radial-gradient(ellipse at 15% 0%, rgba(46, 204, 113, 0.07) 0%, transparent 50%),
                radial-gradient(ellipse at 85% 100%, rgba(96, 165, 250, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(46, 204, 113, 0.02) 0%, transparent 70%);
            background-attachment: fixed;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image:
                linear-gradient(rgba(46, 204, 113, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(46, 204, 113, 0.015) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(46, 204, 113, 0.03); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, rgba(46, 204, 113, 0.35), rgba(46, 204, 113, 0.15)); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, rgba(46, 204, 113, 0.55), rgba(46, 204, 113, 0.25)); }

        /* ============================================================
           NAVBAR
           ============================================================ */
        .navbar-custom {
            background: rgba(5, 10, 18, 0.9);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 0;
            position: sticky;
            top: 0;
            z-index: 1050;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.25);
        }

        .navbar-custom::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(46, 204, 113, 0.4), transparent);
            opacity: 0.6;
        }

        .navbar-custom .navbar-brand {
            font-weight: 800;
            font-size: 1.35rem;
            color: #fff !important;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            position: relative;
        }

        .navbar-custom .navbar-brand:hover {
            color: var(--primary) !important;
            text-shadow: 0 0 20px rgba(46, 204, 113, 0.4);
        }

        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.14), rgba(46, 204, 113, 0.04));
            border: 1px solid rgba(46, 204, 113, 0.25);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.72rem;
            color: var(--primary);
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 12px rgba(46, 204, 113, 0.12);
        }

        .live-indicator .pulse {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary), 0 0 4px var(--primary);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        /* ============================================================
           SIDEBAR TOGGLE
           ============================================================ */
        .sidebar-toggle {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.1), rgba(46, 204, 113, 0.04));
            border: 1px solid var(--border-color);
            color: var(--primary);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .sidebar-toggle::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.25), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sidebar-toggle:hover {
            background: rgba(46, 204, 113, 0.18);
            border-color: var(--border-hover);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(46, 204, 113, 0.25);
        }

        .sidebar-toggle:hover::before { opacity: 1; }
        .sidebar-toggle i { position: relative; z-index: 1; }

        /* ============================================================
           SIDEBAR OVERLAY
           ============================================================ */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 1060;
            display: none;
            opacity: 0;
            transition: opacity 0.35s ease;
        }

        .sidebar-overlay.active { display: block; opacity: 1; }

        /* ============================================================
           SIDEBAR PANEL
           ============================================================ */
        .sidebar-panel {
            position: fixed;
            top: 0;
            right: -340px;
            width: 320px;
            max-width: 85vw;
            height: 100%;
            background: linear-gradient(180deg, rgba(8, 14, 26, 0.99) 0%, rgba(10, 16, 30, 0.99) 100%);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-left: 1px solid var(--border-color);
            z-index: 1070;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 0;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: -25px 0 70px rgba(0, 0, 0, 0.6);
            -webkit-overflow-scrolling: touch;
        }

        .sidebar-panel.open { right: 0; }

        .sidebar-panel .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 16px;
            border-bottom: 1px solid rgba(46, 204, 113, 0.08);
            flex-shrink: 0;
        }

        .sidebar-panel .sidebar-header h5 {
            color: #fff;
            font-weight: 700;
            margin: 0;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-panel .sidebar-header h5 i { color: var(--primary); }

        .sidebar-close {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .sidebar-close:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
            transform: rotate(90deg);
        }

        .user-profile-sidebar {
            padding: 20px;
            border-bottom: 1px solid rgba(46, 204, 113, 0.06);
            margin-bottom: 8px;
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.07), transparent 70%);
            flex-shrink: 0;
            position: relative;
        }

        .user-profile-sidebar::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 20px; right: 20px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(46, 204, 113, 0.25), transparent);
        }

        .user-profile-sidebar .avatar {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary-light), var(--primary-dark));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: #fff;
            box-shadow: 0 6px 20px var(--primary-glow), inset 0 1px 0 rgba(255,255,255,0.2);
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .user-profile-sidebar .avatar:hover {
            transform: scale(1.05) rotate(-3deg);
        }

        .user-profile-sidebar .user-name {
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            line-height: 1.3;
            word-break: break-word;
        }

        .user-profile-sidebar .user-id {
            color: var(--text-muted);
            font-size: 0.75rem;
            margin-top: 2px;
            word-break: break-all;
        }

        .sidebar-panel .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px 18px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            margin: 3px 12px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 0.9rem;
            position: relative;
            overflow: hidden;
            min-height: 46px;
            line-height: 1.3;
        }

        .sidebar-panel .nav-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 0;
            background: linear-gradient(180deg, var(--primary-light), var(--primary-dark));
            border-radius: 0 4px 4px 0;
            transition: height 0.3s ease;
        }

        .sidebar-panel .nav-item:hover {
            background: rgba(46, 204, 113, 0.08);
            color: #fff;
            transform: translateX(3px);
        }

        .sidebar-panel .nav-item:hover::before { height: 22px; }

        .sidebar-panel .nav-item.active {
            background: linear-gradient(90deg, rgba(46, 204, 113, 0.16), rgba(46, 204, 113, 0.02));
            color: var(--primary);
            font-weight: 600;
        }

        .sidebar-panel .nav-item.active::before { height: 26px; }

        .sidebar-panel .nav-item i {
            font-size: 1.15rem;
            width: 24px;
            text-align: center;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .sidebar-panel .nav-item:hover i {
            transform: scale(1.1);
        }

        .sidebar-panel .nav-item span:first-of-type {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sidebar-panel .nav-item .badge {
            margin-left: auto;
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.18), rgba(46, 204, 113, 0.06));
            color: var(--primary);
            font-weight: 700;
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid rgba(46, 204, 113, 0.2);
            flex-shrink: 0;
        }

        .sidebar-panel .sidebar-footer {
            margin-top: auto;
            padding: 16px 20px 24px;
            border-top: 1px solid rgba(46, 204, 113, 0.06);
            flex-shrink: 0;
        }

        .sidebar-panel .sidebar-footer .nav-item { color: var(--red); margin: 0; }
        .sidebar-panel .sidebar-footer .nav-item:hover { background: rgba(239, 68, 68, 0.1); color: var(--red); }
        .sidebar-panel .sidebar-footer .nav-item::before { background: var(--red); }

        /* ============================================================
           DASHBOARD CONTAINER
           ============================================================ */
        .dashboard-container {
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            width: 100%;
        }

        /* ============================================================
           WELCOME SECTION
           ============================================================ */
        .welcome-section {
            background:
                linear-gradient(135deg, rgba(46, 204, 113, 0.1) 0%, rgba(26, 122, 58, 0.03) 50%, rgba(46, 204, 113, 0.06) 100%),
                radial-gradient(ellipse at top right, rgba(46, 204, 113, 0.15), transparent 60%);
            border-radius: var(--radius-lg);
            padding: 30px 34px;
            border: 1px solid rgba(46, 204, 113, 0.15);
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .welcome-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(46, 204, 113, 0.6), transparent);
        }

        .welcome-section::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(46, 204, 113, 0.12), transparent 70%);
            pointer-events: none;
            border-radius: 50%;
        }

        .welcome-section h2 {
            font-size: 1.65rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.6px;
            margin-bottom: 8px;
            line-height: 1.2;
            position: relative;
            z-index: 1;
        }

        .welcome-section h2 span {
            color: var(--primary);
            text-shadow: 0 0 30px rgba(46, 204, 113, 0.4);
        }

        .welcome-section .user-id-badge {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.12), rgba(46, 204, 113, 0.04));
            border: 1px solid rgba(46, 204, 113, 0.22);
            border-radius: 30px;
            padding: 6px 14px 6px 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.78rem;
            color: var(--primary);
            font-weight: 700;
            transition: all 0.3s ease;
            max-width: 100%;
            word-break: break-all;
            position: relative;
            z-index: 1;
            box-shadow: 0 2px 12px rgba(46, 204, 113, 0.1);
        }

        .welcome-section .user-id-badge:hover {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.18), rgba(46, 204, 113, 0.08));
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(46, 204, 113, 0.2);
        }

        .user-id-badge .copy-btn-small {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.2), rgba(46, 204, 113, 0.08));
            border: 1px solid rgba(46, 204, 113, 0.3);
            border-radius: 6px;
            padding: 3px 10px;
            font-size: 0.65rem;
            color: var(--primary);
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 700;
            flex-shrink: 0;
        }

        .user-id-badge .copy-btn-small:hover {
            background: rgba(46, 204, 113, 0.35);
            transform: scale(1.08);
            box-shadow: 0 2px 10px rgba(46, 204, 113, 0.3);
        }

        /* ============================================================
           RANK BADGE
           ============================================================ */
        .rank-badge {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.15), rgba(251, 191, 36, 0.04));
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 30px;
            padding: 7px 18px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--gold);
            font-weight: 700;
            box-shadow: 0 4px 18px rgba(251, 191, 36, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .rank-badge.member {
            background: rgba(46, 204, 113, 0.08);
            border-color: rgba(46, 204, 113, 0.15);
            color: var(--text-secondary);
            box-shadow: none;
        }

        /* ============================================================
           WALLET CARDS
           ============================================================ */
        .wallet-card {
            background: linear-gradient(145deg, rgba(19, 34, 55, 0.75), rgba(15, 26, 44, 0.6));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.5rem 1.15rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            position: relative;
            overflow: hidden;
            height: 100%;
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.04), 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        .wallet-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(46, 204, 113, 0.5), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .wallet-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -30%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(46, 204, 113, 0.08), transparent 70%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .wallet-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-5px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35), 0 0 40px rgba(46, 204, 113, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .wallet-card:hover::before { opacity: 1; }
        .wallet-card:hover::after { opacity: 1; }

        .wallet-card .wallet-icon {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.35rem;
            margin: 0 auto 12px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .wallet-card:hover .wallet-icon { transform: scale(1.1) rotate(-5deg); }

        .wallet-card .wallet-icon.deposit {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.22), rgba(46, 204, 113, 0.06));
            color: var(--primary);
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.2), inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .wallet-card .wallet-icon.referral {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.22), rgba(251, 191, 36, 0.06));
            color: var(--gold);
            box-shadow: 0 6px 20px rgba(251, 191, 36, 0.2), inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .wallet-card .wallet-icon.rnd {
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.22), rgba(96, 165, 250, 0.06));
            color: var(--blue);
            box-shadow: 0 6px 20px rgba(96, 165, 250, 0.2), inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .wallet-card .wallet-icon.locked {
            background: linear-gradient(135deg, rgba(167, 139, 250, 0.22), rgba(167, 139, 250, 0.06));
            color: var(--purple);
            box-shadow: 0 6px 20px rgba(167, 139, 250, 0.2), inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .wallet-card .wallet-icon.release {
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.22), rgba(52, 211, 153, 0.06));
            color: var(--teal);
            box-shadow: 0 6px 20px rgba(52, 211, 153, 0.2), inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .wallet-card .wallet-number {
            font-size: 1.75rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -1px;
            line-height: 1.15;
            word-break: break-all;
            font-style: normal !important;
        }

        .wallet-card .wallet-number.green { color: var(--primary); text-shadow: 0 0 20px rgba(46, 204, 113, 0.25); }
        .wallet-card .wallet-number.gold { color: var(--gold); text-shadow: 0 0 20px rgba(251, 191, 36, 0.25); }
        .wallet-card .wallet-number.blue { color: var(--blue); text-shadow: 0 0 20px rgba(96, 165, 250, 0.25); }
        .wallet-card .wallet-number.purple { color: var(--purple); text-shadow: 0 0 20px rgba(167, 139, 250, 0.25); }
        .wallet-card .wallet-number.teal { color: var(--teal); text-shadow: 0 0 20px rgba(52, 211, 153, 0.25); }

        .wallet-card .wallet-label {
            color: var(--text-secondary);
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-top: 6px;
            line-height: 1.3;
        }

        .wallet-card .wallet-sub {
            color: var(--text-muted);
            font-size: 0.65rem;
            margin-top: 3px;
            line-height: 1.3;
        }

        /* ============================================================
           NETWORK STATS
           ============================================================ */
        .network-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .network-stat-card {
            background: linear-gradient(145deg, rgba(19, 34, 55, 0.7), rgba(15, 26, 44, 0.55));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 22px 16px;
            text-align: center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        .network-stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .network-stat-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: 0 16px 35px rgba(0, 0, 0, 0.3), 0 0 30px rgba(46, 204, 113, 0.08);
        }

        .network-stat-card:hover::before { opacity: 1; }

        .network-stat-card .number {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -1px;
            line-height: 1.1;
            word-break: break-all;
            text-shadow: 0 0 25px rgba(46, 204, 113, 0.3);
        }

        .network-stat-card .label {
            color: var(--text-secondary);
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-top: 8px;
            line-height: 1.3;
        }

        /* ============================================================
           LEVEL STATS
           ============================================================ */
        .level-stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .level-stat-card {
            background: linear-gradient(145deg, rgba(19, 34, 55, 0.7), rgba(15, 26, 44, 0.55));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 15px 10px;
            text-align: center;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        .level-stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .level-stat-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25), 0 0 25px rgba(46, 204, 113, 0.08);
        }

        .level-stat-card:hover::before { opacity: 1; }

        .level-stat-card .number {
            font-size: 1.45rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
            line-height: 1.15;
            word-break: break-all;
            text-shadow: 0 0 20px rgba(46, 204, 113, 0.25);
        }

        .level-stat-card .label {
            color: var(--text-secondary);
            font-size: 0.62rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-top: 5px;
            line-height: 1.3;
        }

        /* ============================================================
           GLASS CARDS
           ============================================================ */
        .card-glass {
            background: linear-gradient(145deg, rgba(19, 34, 55, 0.72), rgba(15, 26, 44, 0.6));
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.6rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            height: 100%;
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.04), 0 4px 20px rgba(0, 0, 0, 0.18);
        }

        .card-glass::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(46, 204, 113, 0.5), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .card-glass:hover {
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35), 0 0 50px rgba(46, 204, 113, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .card-glass:hover::before { opacity: 1; }

        .card-glass .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.3px;
            line-height: 1.3;
        }

        .card-glass .card-title i {
            color: var(--primary);
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        /* ============================================================
           REFERRAL BOX
           ============================================================ */
        .referral-box {
            background: linear-gradient(135deg, rgba(8, 14, 26, 0.7), rgba(10, 18, 32, 0.6));
            border-radius: 12px;
            padding: 14px 16px;
            border: 1px dashed rgba(46, 204, 113, 0.3);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .referral-box:hover {
            border-color: rgba(46, 204, 113, 0.55);
            background: linear-gradient(135deg, rgba(8, 14, 26, 0.9), rgba(10, 18, 32, 0.8));
            box-shadow: 0 0 25px rgba(46, 204, 113, 0.12);
        }

        .referral-box code {
            color: var(--blue);
            font-size: 0.8rem;
            word-break: break-all;
            flex: 1;
            min-width: 0;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            line-height: 1.4;
            font-style: normal !important;
        }

        .copy-btn {
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(46, 204, 113, 0.3);
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.1), rgba(46, 204, 113, 0.04));
            color: var(--primary);
            transition: all 0.3s ease;
            font-size: 0.8rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.22), rgba(46, 204, 113, 0.1));
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.2);
        }

        /* ============================================================
           BUTTONS
           ============================================================ */
        .btn-primary-custom {
            background: linear-gradient(135deg, var(--primary-light), var(--primary-dark));
            border: none;
            color: #fff;
            font-weight: 700;
            padding: 12px 26px;
            border-radius: 12px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.9rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.3), inset 0 1px 0 rgba(255,255,255,0.25);
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .btn-primary-custom::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }

        .btn-primary-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 35px rgba(46, 204, 113, 0.45), inset 0 1px 0 rgba(255,255,255,0.35);
            color: #fff;
        }

        .btn-primary-custom:hover::before { left: 100%; }

        .btn-outline-custom {
            border: 1px solid rgba(46, 204, 113, 0.35);
            color: var(--primary);
            padding: 12px 26px;
            border-radius: 12px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 600;
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.06), rgba(46, 204, 113, 0.02));
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .btn-outline-custom:hover {
            border-color: var(--primary);
            background: rgba(46, 204, 113, 0.12);
            color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(46, 204, 113, 0.2);
        }

        /* ============================================================
           FORM CONTROLS
           ============================================================ */
        .form-control-custom {
            background: rgba(8, 14, 26, 0.85) !important;
            border: 1px solid rgba(46, 204, 113, 0.15) !important;
            color: var(--text-primary) !important;
            padding: 13px 16px !important;
            border-radius: 12px !important;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            font-weight: 500;
            width: 100%;
        }

        .form-control-custom:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 4px rgba(46, 204, 113, 0.15) !important;
            background: rgba(8, 14, 26, 0.98) !important;
            outline: none;
        }

        .form-control-custom::placeholder { color: var(--text-muted) !important; font-weight: 400; }

        .form-select-custom {
            background: rgba(8, 14, 26, 0.85) !important;
            border: 1px solid rgba(46, 204, 113, 0.15) !important;
            color: var(--text-primary) !important;
            padding: 13px 16px !important;
            border-radius: 12px !important;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            font-weight: 500;
            width: 100%;
        }

        .form-select-custom:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 4px rgba(46, 204, 113, 0.15) !important;
            outline: none;
        }

        .form-select-custom option { background: var(--bg-deep); color: var(--text-primary); }

        /* ============================================================
           TRANSFER HISTORY
           ============================================================ */
        .transfer-history {
            margin-top: 15px;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .transfer-history::-webkit-scrollbar { width: 4px; }
        .transfer-history::-webkit-scrollbar-track { background: rgba(46, 204, 113, 0.05); border-radius: 10px; }
        .transfer-history::-webkit-scrollbar-thumb { background: rgba(46, 204, 113, 0.3); border-radius: 10px; }

        .transfer-item {
            background: linear-gradient(135deg, rgba(8, 14, 26, 0.55), rgba(10, 16, 30, 0.4));
            border-radius: 10px;
            padding: 12px 14px;
            border: 1px solid rgba(46, 204, 113, 0.06);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.85rem;
            transition: all 0.25s ease;
        }

        .transfer-item:hover {
            border-color: rgba(46, 204, 113, 0.2);
            background: linear-gradient(135deg, rgba(8, 14, 26, 0.75), rgba(10, 16, 30, 0.6));
            transform: translateX(3px);
        }

        .transfer-item .sent { color: var(--red); font-weight: 700; }
        .transfer-item .received { color: var(--teal); font-weight: 700; }
        .transfer-item .amount { font-weight: 800; font-family: 'Courier New', monospace; font-style: normal !important; }
        .transfer-item .date { color: var(--text-muted); font-size: 0.65rem; }
        .transfer-item .user { color: var(--purple); font-weight: 600; }

        /* ============================================================
           TOAST NOTIFICATIONS
           ============================================================ */
        .toast-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 9999;
            max-width: 420px;
            pointer-events: none;
        }

        .toast-custom {
            background: linear-gradient(135deg, rgba(15, 25, 45, 0.97), rgba(12, 20, 36, 0.95));
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(46, 204, 113, 0.25);
            border-radius: var(--radius-md);
            padding: 16px 22px;
            color: var(--text-primary);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 40px rgba(46, 204, 113, 0.1);
            display: flex;
            align-items: center;
            gap: 14px;
            animation: slideInRight 0.45s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 12px;
            font-size: 0.88rem;
            font-weight: 500;
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        .toast-custom.success { border-left: 4px solid var(--primary); }
        .toast-custom.error { border-left: 4px solid var(--red); }
        .toast-custom.info { border-left: 4px solid var(--blue); }

        .toast-custom i { font-size: 1.4rem; flex-shrink: 0; }
        .toast-custom .toast-msg { flex: 1; line-height: 1.4; }

        @keyframes slideInRight {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ============================================================
           RND PRICE BADGE
           ============================================================ */
        .rnd-price-badge {
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.12), rgba(46, 204, 113, 0.04));
            border: 1px solid rgba(46, 204, 113, 0.25);
            border-radius: 30px;
            padding: 5px 16px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.85rem;
            box-shadow: 0 2px 12px rgba(46, 204, 113, 0.1);
        }

        /* ============================================================
           COMMISSION ROWS
           ============================================================ */
        .commission-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(251, 191, 36, 0.06);
            gap: 8px;
        }

        .commission-row:last-child { border-bottom: none; }

        .commission-row .level {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
        }

        .commission-row .earnings {
            color: var(--gold);
            font-weight: 800;
            font-family: 'Courier New', monospace;
            font-style: normal !important;
            letter-spacing: -0.3px;
            font-size: 0.95rem;
            text-shadow: 0 0 15px rgba(251, 191, 36, 0.2);
        }

        /* ============================================================
           RELEASE INFO BOX
           ============================================================ */
        .release-info-box {
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.1), rgba(52, 211, 153, 0.03));
            border: 1px solid rgba(52, 211, 153, 0.2);
            border-radius: 12px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .release-info-box:hover {
            border-color: rgba(52, 211, 153, 0.35);
            background: linear-gradient(135deg, rgba(52, 211, 153, 0.15), rgba(52, 211, 153, 0.05));
            box-shadow: 0 4px 20px rgba(52, 211, 153, 0.1);
        }

        .release-info-box .label {
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .release-info-box .value {
            color: var(--teal);
            font-weight: 800;
            font-size: 0.95rem;
            font-family: 'Courier New', monospace;
            font-style: normal !important;
        }

        /* ============================================================
           DAYS REMAINING
           ============================================================ */
        .days-remaining {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.12), rgba(251, 191, 36, 0.03));
            border: 1px solid rgba(251, 191, 36, 0.2);
            border-radius: 8px;
            padding: 4px 12px;
            font-size: 0.68rem;
            color: var(--gold);
            font-weight: 700;
            display: inline-block;
        }

        /* ============================================================
           STATUS BADGE
           ============================================================ */
        .status-badge {
            font-size: 0.65rem;
            color: var(--text-muted);
            padding: 3px 12px;
            border-radius: 12px;
            background: rgba(46, 204, 113, 0.05);
            border: 1px solid rgba(46, 204, 113, 0.08);
            font-weight: 700;
            display: inline-block;
        }

        .status-badge.active {
            color: var(--primary);
            background: rgba(46, 204, 113, 0.12);
            border-color: rgba(46, 204, 113, 0.25);
        }

        /* ============================================================
           RESPONSIVE DESIGN
           ============================================================ */

        /* Tablet */
        @media (max-width: 992px) {
            .network-stats { grid-template-columns: repeat(3, 1fr); }
            .level-stats { grid-template-columns: repeat(5, 1fr); }
            .wallet-card .wallet-number { font-size: 1.5rem; }
        }

        /* Small tablet / Large phone landscape */
        @media (max-width: 768px) {
            .dashboard-container { padding: 16px; }
            .welcome-section { padding: 20px; border-radius: var(--radius-md); }
            .welcome-section h2 { font-size: 1.25rem; }
            .network-stats { grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .level-stats { grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .sidebar-panel { width: 300px; right: -320px; max-width: 85vw; }
            .sidebar-panel .nav-item { padding: 12px 16px; font-size: 0.88rem; min-height: 46px; }
            .wallet-card .wallet-number { font-size: 1.4rem; }
            .network-stat-card .number { font-size: 1.5rem; }
            .network-stat-card { padding: 18px 12px; }
            .level-stat-card { padding: 13px 8px; }
            .level-stat-card .number { font-size: 1.25rem; }
            .card-glass { padding: 1.3rem; border-radius: var(--radius-md); }
        }

        /* Phone */
        @media (max-width: 480px) {
            .dashboard-container { padding: 12px; }
            .sidebar-panel { width: 100%; max-width: 100%; right: -100%; }
            .sidebar-panel.open { right: 0; }

            .welcome-section { padding: 16px; border-radius: var(--radius-md); margin-bottom: 16px; }
            .welcome-section h2 { font-size: 1.1rem; }
            .welcome-section .user-id-badge { font-size: 0.72rem; padding: 5px 12px; }

            .network-stats { grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
            .network-stat-card { padding: 14px 8px; border-radius: var(--radius-sm); }
            .network-stat-card .number { font-size: 1.25rem; }
            .network-stat-card .label { font-size: 0.6rem; letter-spacing: 0.2px; margin-top: 4px; }

            .level-stats { grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
            .level-stat-card { padding: 12px 6px; border-radius: var(--radius-sm); }
            .level-stat-card .number { font-size: 1.15rem; }
            .level-stat-card .label { font-size: 0.58rem; letter-spacing: 0.2px; }

            .wallet-card { padding: 1.15rem 0.85rem; border-radius: var(--radius-sm); }
            .wallet-card .wallet-icon { width: 44px; height: 44px; font-size: 1.2rem; margin-bottom: 10px; }
            .wallet-card .wallet-number { font-size: 1.3rem; }
            .wallet-card .wallet-label { font-size: 0.66rem; }
            .wallet-card .wallet-sub { font-size: 0.6rem; }

            .card-glass { padding: 1.15rem; border-radius: var(--radius-md); }
            .card-glass .card-title { font-size: 0.9rem; margin-bottom: 12px; }

            .release-info-box { flex-direction: column; text-align: center; padding: 10px 14px; }

            .navbar-custom .navbar-brand { font-size: 1.15rem; }
            .navbar-custom { padding: 10px 0; }
            .sidebar-toggle { width: 40px; height: 40px; font-size: 1.15rem; }

            .toast-container { top: 12px; right: 12px; left: 12px; max-width: none; }
            .toast-custom { padding: 12px 16px; font-size: 0.82rem; gap: 10px; }
            .toast-custom i { font-size: 1.2rem; }

            .rank-badge { font-size: 0.72rem; padding: 5px 14px; }
            .rnd-price-badge { font-size: 0.75rem; padding: 4px 12px; }

            .btn-primary-custom, .btn-outline-custom {
                padding: 11px 20px;
                font-size: 0.85rem;
            }
            .form-control-custom, .form-select-custom {
                padding: 11px 14px !important;
                font-size: 0.85rem;
            }
            .copy-btn { padding: 6px 12px; font-size: 0.75rem; }
            .referral-box code { font-size: 0.75rem; }

            .commission-row .earnings { font-size: 0.9rem; }
        }

        /* Extra small phone (320px - 380px) */
        @media (max-width: 380px) {
            .dashboard-container { padding: 10px; }
            .welcome-section { padding: 14px; }
            .welcome-section h2 { font-size: 1rem; }
            .network-stats { gap: 6px; }
            .network-stat-card { padding: 12px 6px; }
            .network-stat-card .number { font-size: 1.1rem; }
            .network-stat-card .label { font-size: 0.55rem; }
            .level-stat-card .number { font-size: 1rem; }
            .level-stat-card .label { font-size: 0.55rem; }
            .wallet-card .wallet-number { font-size: 1.1rem; }
            .sidebar-panel .nav-item { padding: 11px 14px; font-size: 0.85rem; }
        }

        /* Print */
        @media print {
            .navbar-custom, .sidebar-toggle, .sidebar-panel, .sidebar-overlay { display: none !important; }
            body { background: #fff; }
            .wallet-card { background: #f8f8f8; border-color: #ddd; }
            .welcome-section { background: #f0f0f0; }
            .wallet-card .wallet-number { color: #000 !important; text-shadow: none !important; }
        }
    </style>
</head>
<body>

<!-- ====== TOAST CONTAINER ====== -->
<div class="toast-container" id="toastContainer"></div>

<!-- ====== NAVBAR ====== -->
<nav class="navbar navbar-custom">
    <div class="container-fluid px-3">
        <a class="navbar-brand" href="dashboard.html">
            RND Staking
        </a>
        <div class="d-flex align-items-center gap-2">
            <span class="live-indicator d-none d-md-flex">
                <span class="pulse"></span> Live
            </span>
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle Menu">
                <i class="bi bi-list"></i>
            </button>
        </div>
    </div>
</nav>

<!-- ====== SIDEBAR OVERLAY ====== -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- ====== SIDEBAR PANEL ====== -->
<div class="sidebar-panel" id="sidebarPanel">
    <div class="sidebar-header">
        <h5><i class="bi bi-grid-1x2-fill"></i> Menu</h5>
        <button class="sidebar-close" id="sidebarClose"><i class="bi bi-x-lg"></i></button>
