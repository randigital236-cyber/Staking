<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <meta name="description" content="Sign in to your RND Staking account securely.">
  <title>Login - RND Staking</title>

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Styles -->
  <link rel="stylesheet" href="login.css">

  <!-- Firebase import map (must be before module script) -->
  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
      "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
    }
  }
  </script>
</head>
<body>

  <!-- Toast notifications -->
  <div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

  <main class="login-container">
    <div class="card-glass">

      <!-- Logo -->
      <div class="brand text-center">
        <div class="logo-text">
          <i class="bi bi-currency-bitcoin"></i>RND<span>Staking</span>
        </div>
        <p class="brand-subtitle">Welcome back! Sign in to your account</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <div class="input-wrapper">
            <i class="bi bi-envelope input-icon"></i>
            <input
              type="email"
              id="loginEmail"
              name="email"
              class="form-control-custom"
              placeholder="you@example.com"
              autocomplete="email"
              autofocus
              required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="input-wrapper">
            <i class="bi bi-lock input-icon"></i>
            <input
              type="password"
              id="loginPassword"
              name="password"
              class="form-control-custom"
              placeholder="••••••••"
              autocomplete="current-password"
              required>
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary-custom" id="loginBtn">
          <span class="btn-text">Sign In <i class="bi bi-arrow-right"></i></span>
        </button>
      </form>

      <!-- Links -->
      <p class="text-center footer-text">
        Don't have an account? <a href="register.html" class="text-link">Register</a>
      </p>
      <p class="text-center">
        <a href="#" id="forgotPasswordLink" class="text-link link-small">Forgot password?</a>
      </p>

    </div>
  </main>

  <!-- Firebase + App logic -->
  <script type="module" src="login.js"></script>
</body>
</html>
