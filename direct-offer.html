<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b18">
  <title>Offer Coming Soon | RND Stake</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b18;
      --panel: rgba(18, 24, 48, .82);
      --text: #f7f8ff;
      --muted: #aab3cf;
      --gold: #f6c85f;
      --cyan: #5de2e7;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(83, 79, 190, .25), transparent 32%),
        radial-gradient(circle at 85% 80%, rgba(28, 190, 194, .16), transparent 30%),
        linear-gradient(145deg, #070914 0%, #0c1228 52%, #080b18 100%);
    }
    body::before, body::after {
      content: "";
      position: fixed;
      width: 340px;
      height: 340px;
      border: 1px solid rgba(246, 200, 95, .12);
      border-radius: 50%;
      pointer-events: none;
    }
    body::before { top: -210px; right: -100px; }
    body::after { bottom: -230px; left: -110px; width: 420px; height: 420px; }
    .page { width: min(100%, 680px); position: relative; z-index: 1; }
    .card {
      position: relative;
      overflow: hidden;
      text-align: center;
      padding: clamp(32px, 7vw, 66px) clamp(22px, 6vw, 54px);
      border: 1px solid rgba(153, 174, 232, .2);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 28px 90px rgba(0, 0, 0, .48), inset 0 1px 0 rgba(255,255,255,.06);
      backdrop-filter: blur(18px);
    }
    .card::before {
      content: "";
      position: absolute;
      inset: 0 12% auto;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--cyan), transparent);
      opacity: .9;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 34px;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: .11em;
    }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 11px;
      color: #101426;
      background: linear-gradient(135deg, #ffe59a, #d99d2b);
      box-shadow: 0 5px 22px rgba(246, 200, 95, .25);
    }
    .brand span:last-child { color: var(--gold); }
    .icon-wrap {
      width: 104px;
      height: 104px;
      display: grid;
      place-items: center;
      margin: 0 auto 28px;
      border-radius: 30px;
      border: 1px solid rgba(246, 200, 95, .34);
      background: linear-gradient(145deg, rgba(246, 200, 95, .16), rgba(93, 226, 231, .08));
      box-shadow: 0 12px 40px rgba(0,0,0,.2), 0 0 45px rgba(246,200,95,.08);
      font-size: 48px;
    }
    .eyebrow {
      display: inline-block;
      margin-bottom: 16px;
      padding: 8px 14px;
      border: 1px solid rgba(93, 226, 231, .28);
      border-radius: 999px;
      color: var(--cyan);
      background: rgba(93, 226, 231, .07);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .18em;
    }
    h1 {
      margin: 0;
      font-size: clamp(34px, 8vw, 58px);
      line-height: 1.06;
      font-weight: 900;
      letter-spacing: -.045em;
      background: linear-gradient(100deg, #fff 12%, #f6d98e 52%, #75e8e8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .subtitle {
      margin: 20px auto 0;
      max-width: 440px;
      color: var(--muted);
      font-size: clamp(14px, 2.5vw, 16px);
      line-height: 1.75;
    }
    .divider {
      width: 76px;
      height: 3px;
      margin: 30px auto;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--gold), var(--cyan));
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 13px;
      margin-top: 32px;
    }
    .btn {
      min-height: 52px;
      min-width: 190px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 23px;
      border-radius: 14px;
      text-decoration: none;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    .btn-primary {
      color: #171525;
      background: linear-gradient(110deg, #ffe49a, #eab64e);
      box-shadow: 0 10px 28px rgba(234, 182, 78, .22);
    }
    .btn-primary:hover { box-shadow: 0 14px 34px rgba(234, 182, 78, .32); }
    .btn-secondary {
      color: #e9edff;
      border: 1px solid rgba(174, 190, 235, .25);
      background: rgba(255,255,255,.045);
    }
    .btn-secondary:hover { background: rgba(255,255,255,.09); }
    .footer {
      margin-top: 30px;
      color: #77819f;
      font-size: 11px;
      letter-spacing: .08em;
    }
    @media (max-width: 480px) {
      body { padding: 16px; }
      .card { border-radius: 22px; }
      .brand { margin-bottom: 28px; }
      .actions { flex-direction: column; }
      .btn { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card" aria-labelledby="pageTitle">
      <div class="brand" aria-label="RND Stake">
        <span class="brand-mark">R</span>
        <span>RND<span>STAKE</span></span>
      </div>

      <div class="icon-wrap" aria-hidden="true">🎁</div>
      <div class="eyebrow">A NEW EXPERIENCE IS ON THE WAY</div>
      <h1 id="pageTitle">OFFER<br>COMING SOON</h1>
      <p class="subtitle">
        Thank you for being part of the RND Stake community.
        Our next offer is being prepared. Stay connected for updates.
      </p>
      <div class="divider" aria-hidden="true"></div>

      <div class="actions">
        <a class="btn btn-primary" href="dashboard.html">
          <span>Go to Dashboard</span><span aria-hidden="true">→</span>
        </a>
        <a class="btn btn-secondary" href="dashboard.html">
          <span aria-hidden="true">←</span><span>Back to Dashboard</span>
        </a>
      </div>

      <div class="footer">RND STAKE · THANK YOU FOR YOUR SUPPORT</div>
    </section>
  </main>
</body>
</html>
