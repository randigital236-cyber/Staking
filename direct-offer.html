
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#100b22">
<title>RND Stake - Offer Coming Soon</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  color: #fff;
  background:
    radial-gradient(circle at top left, #38205c, transparent 45%),
    radial-gradient(circle at bottom right, #50320d, transparent 40%),
    #100b22;
}

.container {
  width: 100%;
  max-width: 650px;
  padding: 55px 25px;
  text-align: center;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(251,191,36,0.35);
  border-radius: 25px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}

.logo {
  font-size: 38px;
  font-weight: 900;
  color: #fbbf24;
  margin-bottom: 18px;
  letter-spacing: 3px;
}

.brand {
  font-size: 15px;
  color: #cbd5e1;
  letter-spacing: 5px;
  margin-bottom: 35px;
}

h1 {
  font-size: clamp(32px, 7vw, 53px);
  line-height: 1.2;
  font-weight: 900;
  color: #fff;
}

h1 span {
  color: #fbbf24;
}

.message {
  margin: 25px auto;
  max-width: 480px;
  color: #cbd5e1;
  font-size: 17px;
  line-height: 1.8;
}

.status {
  display: inline-block;
  margin-top: 15px;
  padding: 13px 25px;
  border: 1px solid #fbbf24;
  border-radius: 50px;
  color: #fde68a;
  background: rgba(251,191,36,0.10);
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 2px;
}

.footer {
  margin-top: 40px;
  color: #94a3b8;
  font-size: 13px;
}

@media(max-width:480px) {
  .container {
    padding: 40px 18px;
  }
  .brand {
    letter-spacing: 3px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">RND</div>

  <div class="brand">RND STAKE</div>

  <h1>
    OFFER<br>
    <span>COMING SOON</span>
  </h1>

  <p class="message">
    We are preparing something exciting
    for our community.

    <br><br>

    A new offer is coming soon.
    Stay connected with RND Stake
    for upcoming announcements.
  </p>

  <div class="status">
    NEW OFFER · COMING SOON
  </div>

  <div class="footer">
    Thank You for Being Part of RND Community.
  </div>

</div>

</body>
</html>
